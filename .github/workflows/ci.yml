# Check the Go code and verify that the Docker image can build and start.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pin third-party actions to immutable commit SHAs.
jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: make fmt-check

      - name: Verify Go modules
        run: make verify

      - name: Run Go static analysis
        run: make vet

      - name: Run Go tests
        run: make test

      - name: Build application
        run: make build

  container:
    name: Container image
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha,scope=crystaloop-ci
          cache-to: type=gha,mode=max,scope=crystaloop-ci
          # Load the image into the runner so the next step can start it.
          load: true
          push: false
          tags: crystaloop:ci

      - name: Start container
        shell: bash
        run: docker run --detach --name crystaloop-ci --publish 127.0.0.1:8888:8888 crystaloop:ci

      - name: Verify ping endpoint
        shell: bash
        run: test "$(curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8888/ping)" = '{"message":"pong"}'

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker logs crystaloop-ci || true

      - name: Remove test container
        if: ${{ always() }}
        run: docker rm --force crystaloop-ci || true
