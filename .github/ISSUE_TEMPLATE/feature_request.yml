name: Feature request
description: Propose a new capability or improvement for CrystaLoop.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: Explain the problem this feature would solve and who it would help.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to add.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, diagrams, links, or implementation notes that clarify the proposal.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request describes one focused capability or improvement.
          required: true
